[package]
name = "linxboard"
version = "1.0.0"
edition = "2021"
description = "High-performance Linux soundboard with global hotkeys"
license = "GPL-3.0"

[dependencies]
# GUI
iced = { version = "0.13", features = ["tokio"] }

# Audio
rodio = { version = "0.19", features = ["symphonia-all"] }

# Global hotkeys (evdev-based)
evdev = { version = "0.12", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# File dialogs
rfd = "0.15"

# System tray
tray-icon = "0.19"
muda = "0.15"
gtk = "0.18"

# Async streams
futures = "0.3"

# System
libc = "0.2"

# Utilities
dirs = "5"
rand = "0.8"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "2"
crossbeam-channel = "0.5"

[features]
default = []

[profile.release]
opt-level = 3
lto = "thin"
strip = true
